# Fase 4 — Despliegue del backend en Google Cloud Run.
# Se ejecuta manualmente (Actions > Deploy Cloud Run > Run workflow) hasta completar la configuración.
#
# Requisitos en GitHub (Settings > Secrets and variables > Actions):
#   Variables: GCP_PROJECT_ID, GCP_REGION (ej. us-central1), GAR_REPOSITORY (Artifact Registry)
#   Secretos:  GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT (Workload Identity Federation)
#   Opcional:  DATABASE_URL y GEMINI_API_KEY como secretos en Secret Manager (db-url, gemini-key)
name: Deploy Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: gemelo-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/gemelo-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir y publicar imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -f backend-api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --min-instances=0 --max-instances=3
