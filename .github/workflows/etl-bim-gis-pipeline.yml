# CI/CD del CDE: al actualizar un modelo IFC, un COBie, un Shapefile o la tabla maestra,
# valida las llaves de vinculación, ejecuta los ETL y (si hay secreto DATABASE_URL) actualiza la BD.
name: ETL BIM-GIS-IoT

on:
  push:
    branches: [main]
    paths:
      - "data-cde/**"
      - "etl-scripts/**"
      - ".github/workflows/etl-bim-gis-pipeline.yml"
  pull_request:
    paths:
      - "data-cde/**"
      - "etl-scripts/**"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl-scripts/requirements.txt

      - name: Fase 1 — validar tabla maestra y llaves
        run: python etl-scripts/validate_master_table.py

      - name: Instalar dependencias ETL
        run: pip install -r etl-scripts/requirements.txt

      - name: GIS — Shapefile a GeoJSON (EPSG:4326)
        run: python etl-scripts/process_shapefiles.py

      - name: BIM — IFC + COBie
        run: python etl-scripts/parse_ifc_cobie.py --strict

      - name: Revalidar tras el ETL
        run: python etl-scripts/validate_master_table.py

      - name: Publicar salidas del ETL
        uses: actions/upload-artifact@v4
        with:
          name: cde-processed
          path: |
            data-cde/processed/
            data-cde/gis/edificaciones.geojson

      - name: Cargar en PostgreSQL + PostGIS + TimescaleDB
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secreto DATABASE_URL no configurado; se omite la carga."
          else
            python etl-scripts/load_to_db.py
          fi
