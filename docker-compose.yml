# Entorno local: PostgreSQL + PostGIS + TimescaleDB, broker MQTT y API.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: gemelo
      POSTGRES_PASSWORD: gemelo
      POSTGRES_DB: gemelo
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemelo -d gemelo"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gemelo:gemelo@db:5432/gemelo
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
